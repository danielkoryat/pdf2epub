[project]
name = "pdf2epub"
version = "0.1.0"
description = "Convert born-digital and scanned PDFs into professional, Kindle-friendly EPUB 3 books"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling==2.139.0",
    "ebooklib>=0.19",
    "fastapi>=0.143.2",
    "pillow>=10",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "torch>=2.6",
    "torchvision>=0.21",
    "uvicorn>=0.30",
]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"
pdf2epub-web = "pdf2epub.web.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

# CUDA build of PyTorch on Windows/Linux so Docling's layout model runs on an NVIDIA GPU (macOS: regular wheels).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs Docling models end to end"]
